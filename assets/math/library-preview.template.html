<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>小学 · 初中数学组件库</title><style>
/* SHARED_STYLES */
*{box-sizing:border-box}body{margin:0;background:var(--math-bg);color:var(--math-white);font-family:var(--font-chinese)}main{max-width:1200px;margin:auto;padding:32px 24px}h1{font-size:30px;margin:0 0 8px}p{line-height:1.65;color:var(--math-muted)}nav{display:flex;flex-wrap:wrap;gap:8px;margin:26px 0 20px}button,select{font:inherit;background:#152630;color:var(--math-white);border:1px solid #49616F;border-radius:8px;padding:9px 14px;cursor:pointer}button[aria-selected=true]{border-color:var(--math-a);color:var(--math-a);background:#12332F}button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--math-a);outline-offset:4px}.controls{display:flex;gap:22px;flex-wrap:wrap;align-items:end;padding:18px;background:#101F28;border-radius:12px}label{display:grid;gap:10px;font-size:15px;min-width:150px}input{width:165px;accent-color:var(--math-a)}output{color:var(--math-a);font-variant-numeric:tabular-nums}svg{display:block;width:100%;height:auto;margin:10px 0;border:1px solid #20343F;border-radius:12px}#summary{font-size:21px;color:var(--math-white);min-height:32px}#note{min-height:52px;margin-bottom:0}.tag{font-size:13px;letter-spacing:.1em;color:var(--math-a);margin:0 0 12px}footer{font-size:13px;color:var(--math-muted);border-top:1px solid #20343F;margin-top:26px;padding-top:16px}@media(max-width:600px){main{padding:20px 14px}h1{font-size:24px}nav{gap:6px}nav button{padding:8px;font-size:14px}.controls{gap:16px}label{min-width:130px}input{width:135px}#summary{font-size:18px}}
</style></head><body><main><p class="tag">数学表征 · 可复用组件</p><h1>小学 · 初中数学组件库</h1><p><a href="expansion-preview.html" style="color:#56C8AF">打开课程补充库：39 类新示例 →</a></p><p>调整参数，检查图形、数量和标注是否始终对应。这里展示组件能力；完整讲解的步骤与停顿由具体题目安排。</p><nav role="tablist" aria-label="组件分类" id="tabs"></nav><section role="tabpanel" id="panel"><div id="controls" class="controls"></div><p id="note"></p><svg id="canvas" viewBox="0 0 1000 600" role="img" aria-label="数学组件交互图"></svg><p id="summary" aria-live="polite"></p></section><footer>沿用已确认的深蓝灰底色与数学标注风格 · 本页可离线打开 · 未导出视频</footer></main>
<script>
/* COMPONENT_SOURCES */
const C=mathColors;
const canvas=document.querySelector('#canvas'),controls=document.querySelector('#controls'),summary=document.querySelector('#summary'),note=document.querySelector('#note'),tabs=document.querySelector('#tabs');
let current,component,values={},plane;
const examples={
 number:{title:'数轴与区间',note:'同一刻度表示有理数、距离和有向变化；实心与空心端点区分区间是否包含端点。',controls:[['start','起点',-4,2,1,-2],['end','终点',-2,4,1,3]],create:()=>createNumberLine(canvas,{x:110,y:310,width:780}),update:()=>{const{start,end}=values;const m=component.update({markers:[{id:'A',value:start,label:'A',labelOffset:50},{id:'B',value:end,label:'B',labelOffset:80,color:C.red}],interval:{start:Math.min(start,end),end:Math.max(start,end),startClosed:true,endClosed:false},jump:{from:start,to:end}});summary.textContent=`B − A = ${fmt(end-start)}；距离 |B − A| = ${fmt(Math.abs(end-start))}`}},
 fractions:{title:'等分与分数',note:'外框始终代表同一个整体。细分后的小块继承原来三等分的来源组；改变份数不会改变已选面积的比例。',controls:[['factor','每份再分',1,5,1,2],['selected','选中原来的几份',0,3,1,2]],create:()=>createFractionGrid(canvas,{x:140,y:150,width:720,height:220,sourceColumns:3,sourceId:'A',sourceColors:{'A/0:0':C.green,'A/0:1':C.red,'A/0:2':C.purple}}),update:()=>{const{factor,selected}=values;const m=component.update({columns:3*factor,selected:selected*factor,showUnits:factor<=3});summary.textContent=`${selected}/3 = ${m.selected}/${m.denominator} ≈ ${fmt(m.value)} = ${fmt(m.value*100)}%`}},
 polygon:{title:'多边形与变换',note:'顶点、边长和高共用几何状态。改变顶点位置会改变形状；旋转、平移、反射保持大小，缩放按比例改变长度与面积。',controls:[['kind','图形',['triangle','parallelogram','trapezoid','pentagon'],['三角形','平行四边形','梯形','五边形'],'triangle'],['apex','顶点横向位置',-100,180,10,80],['rotation','旋转角度',-90,90,15,0],['scale','缩放',.7,1.2,.1,1],['reflect','反射',['none','x','y'],['无','关于局部 x 轴','关于局部 y 轴'],'none']],create:()=>createPolygon(canvas,{points:[[0,0],[280,0],[80,-180]],pose:{x:340,y:320}}),update:()=>{const{kind,apex,rotation,scale,reflect}=values;const points=kind==='triangle'?[[0,0],[280,0],[apex,-180]]:kind==='parallelogram'?[[0,0],[280,0],[280+apex,-180],[apex,-180]]:kind==='trapezoid'?[[0,0],[280,0],[apex+110,-180],[apex,-180]]:[[0,0],[240,0],[300,-140],[130,-230],[-40,-130]];const m=component.update({points,altitudeVertex:kind==='pentagon'?null:2,base:0,edgeLabels:['b'],pose:{x:340,y:390,cx:140,cy:-90,rotation,scale,reflect:reflect==='none'?null:reflect}});summary.textContent=`面积 ${fmt(m.area)}；周长 ${fmt(m.perimeter)}${m.altitude?`；高 ${fmt(m.altitude.height)}${m.altitude.external?'（垂足在边的延长线上）':''}`:''}（画布单位）`}},
 angle:{title:'角与角标',note:'角弧与数值由同一对射线计算；可区分小角、优角与直角。平行线或内角和的证明仍需题目提供对应关系。',controls:[['degrees','两射线夹角',0,180,5,60],['reflex','选取的角',['minor','reflex'],['小角','优角 / 周角'],'minor']],create:()=>createAngle(canvas,{vertex:[480,330],start:[700,330],end:[590,140],radius:72,color:C.green}),update:()=>{const t=values.degrees*Math.PI/180,m=component.update({end:[480+220*Math.cos(t),330-220*Math.sin(t)],reflex:values.reflex==='reflex'});summary.textContent=`角度 ${fmt(m.degrees)}°${m.isRight?'，直角标记与射线同步':''}`}},
 sectors:{title:'圆与扇形等分',note:'四个来源组在细分前建立。每个子扇形保留来源 ID、填色和弧线标记，可单独接入平移、旋转与重排。',controls:[['factor','每个来源分成',1,16,1,2],['spread','第一组平移',0,70,5,0]],create:()=>createSectorPartition(canvas,{x:460,y:285,radius:185,sourceCount:4,sourceColors:{'source-0':C.green,'source-1':C.red,'source-2':C.purple,'source-3':C.gold}}),update:()=>{const count=4*values.factor,poses={};for(const s of sectorPartitionModel({count,sourceCount:4}).sectors)if(s.parentId==='source-0')poses[s.id]={x:values.spread,y:-values.spread/2};const m=component.update({count,poses});summary.textContent=`${count} 等分；每块面积为整圆的 1/${count}；每组面积始终为整圆的 1/4`}},
 functions:{title:'函数与坐标',note:'一次函数、二次函数和反比例函数共用坐标映射。反比例函数在 x = 0 处分段，未定义的点不会画成曲线上的点。',controls:[['kind','函数',['linear','quadratic','reciprocal'],['y = ax + b','y = ax² + bx + c','y = a/x'],'linear'],['a','系数 a',-2,2,.25,1],['probe','观察点 x',-4,4,.25,1]],create:()=>{plane=createCoordinatePlane(canvas,{origin:[480,290],unit:48,xMin:-5,xMax:5,yMin:-4,yMax:4});return createFunctionGraph(canvas,{toScreen:plane.toScreen,xMin:-5,xMax:5,yMin:-4,yMax:4})},update:()=>{const a=values.kind==='reciprocal'&&values.a===0?.25:values.a;if(a!==values.a){values.a=a;const n=controls.querySelector('[name=a]');n.value=a;n.previousElementSibling.querySelector('output').textContent=a}const m=component.update({kind:values.kind,a,b:0,c:0,probeX:values.probe});summary.textContent=`${values.kind==='linear'?`y = ${fmt(a)}x`:values.kind==='quadratic'?`y = ${fmt(a)}x²`:`y = ${fmt(a)}/x`}；x = ${fmt(values.probe)} 时，${m.probe.y===null?'函数无定义':`y = ${fmt(m.probe.y)}${m.probe.visible?'':'（超出当前画面）'}`}`}},
 algebra:{title:'代数块与正负项',note:'字母表示项的种类，虚线和负号表示负项。块的物理面积始终为正，负块表示带符号的代数量；正负同类项可以组成零对。',controls:[['positive','正 x 块',0,4,1,3],['negative','负 x 块',0,4,1,1],['ones','常数块',-3,3,1,2]],create:()=>createAlgebraTiles(canvas),update:()=>{const terms=[];for(let i=0;i<values.positive;i++)terms.push({id:`p${i}`,kind:'x',sign:1,x:130+i*180,y:140});for(let i=0;i<values.negative;i++)terms.push({id:`n${i}`,kind:'x',sign:-1,x:130+i*180,y:270});for(let i=0;i<Math.abs(values.ones);i++)terms.push({id:`one${i}`,kind:'one',sign:Math.sign(values.ones),x:130+i*90,y:400});const m=component.update({terms});summary.textContent=`${values.positive}x − ${values.negative}x ${values.ones>=0?'+':'−'} ${Math.abs(values.ones)} = ${fmt(m.coefficients.x)}x ${m.coefficients.one>=0?'+':'−'} ${Math.abs(m.coefficients.one)}`}},
 solids:{title:'立体图形',note:'线框用固定投影表示空间关系，虚线表示遮挡。尺寸使用真实参数；屏幕投影长度不能直接当成空间长度。公式数值用于检查，不代替推导。',controls:[['kind','图形',['cuboid','cylinder','cone','sphere'],['长方体','圆柱','圆锥','球'],'cuboid'],['height','高 h',1,4,1,3],['radius','半径 r',1,3,.5,2]],create:()=>createSolid(canvas,{origin:[430,440],unit:65,width:3,depth:2}),update:()=>{const m=component.update({kind:values.kind,height:values.height,radius:values.radius});summary.textContent=`体积 ≈ ${fmt(m.volume)}；表面积 ≈ ${fmt(m.surfaceArea)}（相应的立方 / 平方单位）`}},
 charts:{title:'统计图',note:'条形图与折线图从零开始计量，扇形图按占比划分。下方均值与中位数统计的是这四个数值，不是把数值当频数后的加权统计。',controls:[['kind','图表',['bar','line','pie'],['条形图','折线图','扇形图'],'bar'],['value','B 组数值',0,10,1,7]],create:()=>createDataChart(canvas,{x:130,y:450,width:600,height:310,max:10}),update:()=>{const m=component.update({kind:values.kind,data:[{id:'A',label:'A组',value:4},{id:'B',label:'B组',value:values.value},{id:'C',label:'C组',value:2},{id:'D',label:'D组',value:6}]});summary.textContent=`合计 ${fmt(m.total)}；平均数 ${fmt(m.mean)}；中位数 ${fmt(m.median)}`}},
 probability:{title:'概率树',note:'5 个球中连续取 2 个，不放回。第二次分支使用第一次结果下的条件概率；末端概率是沿路径相乘的结果。',controls:[['red','5 个球中的红球数',1,4,1,3]],create:()=>createProbabilityTree(canvas,{x:100,y:70,width:690,height:430}),update:()=>{const r=values.red,b=5-r,tree={id:'root',label:'开始',children:[{id:'R',label:'红',probability:r/5,children:[{id:'RR',label:'红 → 红',probability:(r-1)/4},{id:'RB',label:'红 → 白',probability:b/4}]},{id:'W',label:'白',probability:b/5,children:[{id:'WR',label:'白 → 红',probability:r/4},{id:'WW',label:'白 → 白',probability:(b-1)/4}]}]};const m=component.update({tree});summary.textContent=`P(两红) = ${fmt(m.leaves[0].probability)}；P(一红一白) = ${fmt(m.leaves[1].probability+m.leaves[2].probability)}；所有末端概率之和 = 1`}}
};
function selectExample(key){current=key;values={};canvas.setAttribute('viewBox',key==='polygon'?'-100 -160 1200 920':'0 0 1000 600');canvas.replaceChildren();controls.replaceChildren();const e=examples[key];note.textContent=e.note;for(const [name,label,min,max,step,value] of e.controls){const wrap=document.createElement('label');const title=document.createElement('span');title.textContent=label+' ';wrap.append(title);let input;if(Array.isArray(min)){input=document.createElement('select');min.forEach((v,i)=>{const o=document.createElement('option');o.value=v;o.textContent=max[i];input.append(o)});values[name]=step;input.value=step;}else{input=document.createElement('input');input.type='range';input.min=min;input.max=max;input.step=step;input.value=value;values[name]=value;const out=document.createElement('output');out.textContent=value;title.append(out);}input.name=name;input.addEventListener('input',()=>{values[name]=input.tagName==='SELECT'?input.value:Number(input.value);const out=title.querySelector('output');if(out)out.textContent=input.value;e.update();});wrap.append(input);controls.append(wrap);}const reset=document.createElement('button');reset.textContent='恢复默认';reset.onclick=()=>selectExample(key);controls.append(reset);component=e.create();e.update();tabs.querySelectorAll('button').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.key===key)));canvas.setAttribute('aria-label',e.title+'交互图');}
for(const[key,e]of Object.entries(examples)){const b=document.createElement('button');b.textContent=e.title;b.dataset.key=key;b.setAttribute('role','tab');b.setAttribute('aria-controls','panel');b.onclick=()=>selectExample(key);tabs.append(b);}selectExample('number');
window.libraryPreview={examples,select:selectExample,get component(){return component},get values(){return values},get current(){return current}};
</script></body></html>
