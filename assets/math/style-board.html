<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>几何素材样式</title>
<link rel="stylesheet" href="math-style.css">
<style>
#axes{overflow:visible}
*{box-sizing:border-box}body{margin:0;padding:36px 40px;background:var(--math-bg);color:var(--math-white);font-family:var(--font-chinese)}main{max-width:1280px;margin:auto}header{display:flex;align-items:end;justify-content:space-between;gap:24px;margin-bottom:26px}h1{font-size:34px;font-weight:700;letter-spacing:.5px;margin:0 0 10px}header p{font-size:16px;color:var(--math-muted);margin:0;line-height:1.6}.direction{font-size:14px!important;text-align:right}.gallery{display:grid;grid-template-columns:1fr 1fr;gap:20px}.card{border:1px solid #2A3943;border-radius:12px;padding:20px 24px 10px;min-width:0}.card-head{display:flex;justify-content:space-between;align-items:center;gap:12px}h2{font-size:20px;font-weight:600;margin:0}.card-head span{font-size:13px;color:var(--math-muted)}.diagram{display:block;width:100%;height:330px;margin-top:4px}footer{margin-top:22px;color:var(--math-muted);font-size:14px;line-height:1.7}footer strong{color:var(--math-white);font-weight:400}
@media(max-width:720px){body{padding:24px 18px}header{display:block}h1{font-size:28px}.direction{margin-top:12px!important;text-align:left}.gallery{grid-template-columns:1fr}.card{padding:18px}.diagram{height:auto;aspect-ratio:560/330}.card-head span{font-size:12px}}
</style>
<style id="diagram-style">
.diagram{font-family:"Helvetica Neue",Arial,sans-serif;font-weight:500}
.shape{fill:#B19CFF;fill-opacity:.12;stroke:#B19CFF;stroke-width:3;stroke-linejoin:round}
.measure{fill:none;stroke-width:2;stroke-linecap:round}
.length-a{fill:#55DFBC}.length-b{fill:#F47D7D}.neutral{fill:#F3F5F7}
.line-a{stroke:#55DFBC}.line-b{stroke:#F47D7D}.line-neutral{stroke:#F3F5F7}
.variable{font-size:34px;text-anchor:middle;dominant-baseline:central}
.vertex{font-size:23px;text-anchor:middle;dominant-baseline:central;fill:#F3F5F7}
.axis{stroke:#AAB6C2;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.grid{stroke:#AAB6C2;stroke-width:1;opacity:.14;fill:none}
.tick-text{fill:#AAB6C2;font-size:19px;text-anchor:middle;dominant-baseline:central}
.axis-letter{fill:#F3F5F7;font-size:29px;text-anchor:middle;dominant-baseline:central}
</style>
</head>
<body><main>
<header><div><h1>几何素材样式</h1><p>三角形、圆形、矩形、坐标轴</p></div><p class="direction">深色底 · 细轮廓 · 淡填色 · 正立标注</p></header>
<div class="gallery">
<section class="card"><div class="card-head"><h2>三角形</h2><span>顶点 · 边长 · 直角标记</span></div>
<svg id="triangle" class="diagram" viewBox="0 0 560 330" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="直角三角形 ABC，底边 a、竖边 b、斜边 c，直角位于 C">
<title>三角形素材样式</title>
<path class="shape" d="M150 65 L420 260 L150 260 Z"/>
<path class="measure line-neutral" d="M150 239 H171 V260"/>
<path class="measure line-a" d="M150 279 V289 M150 284 H420 M420 279 V289"/>
<path class="measure line-b" d="M121 65 H131 M126 65 V260 M121 260 H131"/>
<text class="variable length-a" x="285" y="312">a</text><text class="variable length-b" x="98" y="162.5">b</text><text class="variable neutral" x="307" y="132">c</text>
<text class="vertex" x="142" y="39">A</text><text class="vertex" x="443" y="268">B</text><text class="vertex" x="123" y="280">C</text>
</svg></section>
<section class="card"><div class="card-head"><h2>圆形</h2><span>圆心 · 半径</span></div>
<svg id="circle" class="diagram" viewBox="0 0 560 330" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="以 O 为圆心，半径为 r 的圆">
<title>圆形素材样式</title>
<circle class="shape" cx="280" cy="164" r="110"/>
<path class="measure line-a" d="M280 164 H390"/>
<circle class="neutral" cx="280" cy="164" r="4"/>
<text class="vertex" x="260" y="188">O</text><text class="variable length-a" x="335" y="137">r</text>
</svg></section>
<section class="card"><div class="card-head"><h2>矩形</h2><span>两条边长 · 外置括号</span></div>
<svg id="rectangle" class="diagram" viewBox="0 0 560 330" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="底边 a、竖边 b 的矩形">
<title>矩形素材样式</title>
<rect class="shape" x="150" y="75" width="270" height="185"/>
<path class="measure line-a" d="M150 279 V289 M150 284 H420 M420 279 V289"/>
<path class="measure line-b" d="M121 75 H131 M126 75 V260 M121 260 H131"/>
<text class="variable length-a" x="285" y="312">a</text><text class="variable length-b" x="98" y="167.5">b</text>
</svg></section>
<section class="card"><div class="card-head"><h2>坐标轴</h2><span>原点 · 刻度 · 辅助网格</span></div>
<svg id="axes" class="diagram" viewBox="0 0 560 330" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="等比例刻度的 x、y 坐标轴，包含正负方向和原点">
<title>坐标轴素材样式</title>
<path class="grid" d="M90 55 V255 M140 55 V255 M190 55 V255 M240 55 V255 M290 55 V255 M340 55 V255 M390 55 V255 M440 55 V255 M90 55 H440 M90 105 H440 M90 155 H440 M90 205 H440 M90 255 H440"/>
<path class="axis" d="M70 205 H488 M476 198 L488 205 L476 212 M240 292 V30 M233 42 L240 30 L247 42"/>
<path class="axis" d="M90 201 V209 M140 201 V209 M190 201 V209 M290 201 V209 M340 201 V209 M390 201 V209 M440 201 V209 M236 55 H244 M236 105 H244 M236 155 H244 M236 255 H244"/>
<g class="tick-text"><text x="90" y="227">−3</text><text x="140" y="227">−2</text><text x="190" y="227">−1</text><text x="290" y="227">1</text><text x="340" y="227">2</text><text x="390" y="227">3</text><text x="440" y="227">4</text><text x="217" y="227">0</text><text x="217" y="55">3</text><text x="217" y="105">2</text><text x="217" y="155">1</text><text x="217" y="255">−1</text></g>
<text class="axis-letter" x="509" y="205">x</text><text class="axis-letter" x="240" y="-4">y</text>
</svg></section>
</div>
<footer><strong>统一处理：</strong>同样的轮廓粗细、填色浓度和标注字体；边长标注外置，圆心与半径按几何关系定位。</footer>
</main></body></html>
