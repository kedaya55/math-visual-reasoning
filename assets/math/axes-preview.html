<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>坐标轴 · 交互预览</title>
<style>
:root {
  --math-bg:#0B151C;
  --math-white:#F3F5F7;
  --math-muted:#AAB6C2;
  --math-a:#55DFBC;
  --math-b:#F47D7D;
  --math-area:#B19CFF;
  --font-chinese:"PingFang SC","Hiragino Sans GB",sans-serif;
  --font-math:"Helvetica Neue",Arial,sans-serif;
}
/* Explicit local faces stop automatic web-font substitution in the render compiler. */
@font-face {font-family:"PingFang SC";src:local("PingFangSC-Regular");font-weight:400}
@font-face {font-family:"PingFang SC";src:local("PingFangSC-Semibold");font-weight:600}
@font-face {font-family:"PingFang SC";src:local("PingFangSC-Semibold");font-weight:700}
@font-face {font-family:"Helvetica Neue";src:local("HelveticaNeue-Medium");font-weight:500}
@font-face {font-family:"Helvetica Neue";src:local("HelveticaNeue-Bold");font-weight:600}
.var-a {color:var(--math-a);fill:var(--math-a)}
.var-b {color:var(--math-b);fill:var(--math-b)}
.math-neutral {color:var(--math-white);fill:var(--math-white)}
.edge-label {font-family:var(--font-math);font-style:normal;font-weight:500}
.coordinate-plane {font-family:var(--font-math)}
.axis-line {fill:none;stroke:var(--math-muted);stroke-width:2}
.axis-grid {fill:none;stroke:var(--math-muted);stroke-width:1;opacity:.14}
.axis-number {fill:var(--math-muted);font-size:24px;font-weight:500}
.axis-name {fill:var(--math-white);font-size:30px;font-weight:500}

*{box-sizing:border-box}body{margin:0;padding:40px;background:var(--math-bg);color:var(--math-white);font-family:var(--font-chinese)}main{max-width:1120px;margin:auto}header{margin-bottom:28px}h1{font-size:32px;margin:0 0 12px}p{color:var(--math-muted);line-height:1.7;margin:0}a{color:var(--math-muted);font-size:14px;text-decoration:none}a:hover{text-decoration:underline}.layout{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:24px}.stage,aside{border:1px solid #2A3943;border-radius:12px}.stage{display:flex;align-items:center;min-width:0}svg{display:block;width:100%;height:auto}aside{padding:28px 24px}h2{font-size:18px;margin:0 0 28px}label{display:block;margin-bottom:32px}label span{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}output{font-family:var(--font-math);font-weight:500;font-size:22px}input{width:100%;margin:0;cursor:pointer}input{accent-color:var(--math-muted)}.a{color:var(--math-a)}.b{color:var(--math-b)}button{font:inherit;color:var(--math-white);background:transparent;border:1px solid #35434e;border-radius:8px;padding:10px 16px;cursor:pointer;width:100%}button:hover{border-color:var(--math-white)}button:focus-visible,input:focus-visible{outline:2px solid var(--math-white);outline-offset:5px}.note{font-size:14px;margin:26px 0}footer{margin-top:22px} @media(max-width:720px){body{padding:24px 18px}.layout{grid-template-columns:1fr;gap:16px}h1{font-size:28px}aside{padding:22px}h2{margin-bottom:22px}label{margin-bottom:24px}}
.axis-number{font-size:19px}.axis-name{font-size:29px;fill:var(--math-white)}.axis-grid{opacity:.14}.axis-line{stroke-linecap:round;stroke-linejoin:round}output{font-size:18px}
</style>
</head>
<body><main>
<header><h1>坐标轴</h1><p>调整范围与间距，观察刻度和网格同步变化。</p></header>
<div class="layout">
<div class="stage"><svg viewBox="0 0 620 520" role="img" aria-labelledby="diagram-title diagram-description">
<title id="diagram-title">平面直角坐标系</title><desc id="diagram-description">包含正负方向，x、y 轴使用相同刻度间距。</desc><g id="axes-layer"></g>
</svg></div>
<aside><h2>调整坐标轴</h2>
<label for="x-range"><span>x 轴范围 <output id="x-value" for="x-range">−3 ～ 3</output></span><input id="x-range" type="range" min="2" max="4" step="1" value="3"></label>
<label for="y-range"><span>y 轴范围 <output id="y-value" for="y-range">−2 ～ 2</output></span><input id="y-range" type="range" min="1" max="3" step="1" value="2"></label>
<label for="spacing"><span>刻度间距 <output id="spacing-value" for="spacing">50</output></span><input id="spacing" type="range" min="45" max="55" step="1" value="50"></label>
<p class="note">原点保持不动，两轴每一格都代表 1，横纵方向使用相同的间距。</p>
<button id="reset" type="button">恢复初始设置</button>
</aside></div>
<footer><a href="style-board.html">查看四种几何素材样式 →</a></footer>
</main>
<script>
// A linear, equally scaled Cartesian frame. Plot content and timing belong to its caller.
function coordinateMap({origin=[0,0],unit=1}={}) {
  if(origin.length!==2||![...origin,unit].every(Number.isFinite)||unit<=0) throw new RangeError('Finite origin and positive unit required');
  return ([x,y])=>{
    if(![x,y].every(Number.isFinite)) throw new RangeError('Finite coordinates required');
    return [origin[0]+x*unit,origin[1]-y*unit];
  };
}
function createCoordinatePlane(layer,{id='axes',origin=[110,650],unit=80,xMin=0,xMax=6,yMin=0,yMax=6}={}) {
  let state={origin:[...origin],unit,xMin,xMax,yMin,yMax};
  const validate=next=>{
    if(![next.xMin,next.yMin].every(n=>Number.isInteger(n)&&n<=0&&n>=-20)||
       ![next.xMax,next.yMax].every(n=>Number.isInteger(n)&&n>0&&n<=20)) throw new RangeError('Axis ranges must include zero, with limits from -20 to 20');
    return coordinateMap(next);
  };
  let mapping=validate(state);
  const group=layer.ownerDocument.createElementNS('http://www.w3.org/2000/svg','g');group.id=id;group.setAttribute('class','coordinate-plane');
  const add=(tag,attrs,text)=>{const e=layer.ownerDocument.createElementNS(group.namespaceURI,tag);for(const [k,v]of Object.entries(attrs))e.setAttribute(k,v);if(text!==undefined)e.textContent=text;group.append(e);return e;};
  const grid=add('path',{class:'axis-grid'}),ticks=add('path',{class:'axis-line'}),axes=add('path',{class:'axis-line'});
  const zero=add('text',{'text-anchor':'end',class:'axis-number'},'0');
  const xLabel=add('text',{class:'axis-name'},'x'),yLabel=add('text',{'text-anchor':'middle',class:'axis-name'},'y');
  const numbers=new Map();
  function update(next={}) {
    const candidate={...state,...next,origin:[...(next.origin??state.origin)]};
    const nextMapping=validate(candidate);
    state=candidate;mapping=nextMapping;
    const {origin:[ox,oy],unit,xMin,xMax,yMin,yMax}=state;
    const left=ox+xMin*unit,right=ox+xMax*unit,top=oy-yMax*unit,bottom=oy-yMin*unit;
    const gridPaths=[],tickPaths=[],active=new Set();
    const number=(key,value,x,y,anchor)=>{
      active.add(key);
      if(!numbers.has(key))numbers.set(key,add('text',{class:'axis-number'},String(value).replace('-','−')));
      const node=numbers.get(key);node.setAttribute('x',x);node.setAttribute('y',y);node.setAttribute('text-anchor',anchor);
    };
    for(let x=xMin;x<=xMax;x++)if(x!==0){
      const px=ox+x*unit;
      gridPaths.push(`M${px} ${bottom}V${top}`);tickPaths.push(`M${px} ${oy-4}V${oy+4}`);
      number(`x${x}`,x,px,oy+28,'middle');
    }
    for(let y=yMin;y<=yMax;y++)if(y!==0){
      const py=oy-y*unit;
      gridPaths.push(`M${left} ${py}H${right}`);tickPaths.push(`M${ox-4} ${py}H${ox+4}`);
      number(`y${y}`,y,ox-20,py+7,'end');
    }
    for(const [key,node]of numbers)if(!active.has(key)){node.remove();numbers.delete(key)}
    grid.setAttribute('d',gridPaths.join(' '));ticks.setAttribute('d',tickPaths.join(' '));
    axes.setAttribute('d',`M${left-(xMin<0?20:0)} ${oy}H${right+26}M${ox} ${bottom+(yMin<0?20:0)}V${top-26}M${ox-7} ${top-14}L${ox} ${top-26}L${ox+7} ${top-14}M${right+14} ${oy-7}L${right+26} ${oy}L${right+14} ${oy+7}`);
    zero.setAttribute('x',ox-12);zero.setAttribute('y',oy+28);
    xLabel.setAttribute('x',right+45);xLabel.setAttribute('y',oy+9);
    yLabel.setAttribute('x',ox);yLabel.setAttribute('y',top-52);
  }
  update();layer.append(group);
  return {group,toScreen:point=>mapping(point),update};
}
function riseRun(start,end) {
  if(![start,end].every(p=>p.length===2&&p.every(Number.isFinite))) throw new RangeError('Finite 2D points required');
  const dx=end[0]-start[0],dy=end[1]-start[1];
  return {dx,dy,slope:dx===0?null:dy/dx};
}

const xInput=document.getElementById('x-range'),yInput=document.getElementById('y-range'),spacingInput=document.getElementById('spacing');
const plane=createCoordinatePlane(document.getElementById('axes-layer'),{id:'coordinate-axes',origin:[290,280],unit:50,xMin:-3,xMax:3,yMin:-2,yMax:2});
function refresh(){
 const x=Number(xInput.value),y=Number(yInput.value),unit=Number(spacingInput.value);
 plane.update({xMin:-x,xMax:x,yMin:-y,yMax:y,unit});
 document.getElementById('x-value').value=`−${x} ～ ${x}`;
 document.getElementById('y-value').value=`−${y} ～ ${y}`;
 document.getElementById('spacing-value').value=String(unit);
 document.getElementById('diagram-description').textContent=`平面直角坐标系，x 轴从负 ${x} 到 ${x}，y 轴从负 ${y} 到 ${y}，横纵刻度间距相同。`;
}
for(const input of [xInput,yInput,spacingInput])input.addEventListener('input',refresh);
document.getElementById('reset').addEventListener('click',()=>{xInput.value='3';yInput.value='2';spacingInput.value='50';refresh()});
refresh();
</script></body></html>
