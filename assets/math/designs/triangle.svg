<svg id="triangle" class="diagram" viewBox="0 0 560 330" xmlns="http://www.w3.org/2000/svg" width="560" height="330" role="img" aria-label="直角三角形 ABC，底边 a、竖边 b、斜边 c，直角位于 C">
<style>
.diagram{font-family:"Helvetica Neue",Arial,sans-serif;font-weight:500}
.shape{fill:#B19CFF;fill-opacity:.12;stroke:#B19CFF;stroke-width:3;stroke-linejoin:round}
.measure{fill:none;stroke-width:2;stroke-linecap:round}
.length-a{fill:#55DFBC}.length-b{fill:#F47D7D}.neutral{fill:#F3F5F7}
.line-a{stroke:#55DFBC}.line-b{stroke:#F47D7D}.line-neutral{stroke:#F3F5F7}
.variable{font-size:34px;text-anchor:middle;dominant-baseline:central}
.vertex{font-size:23px;text-anchor:middle;dominant-baseline:central;fill:#F3F5F7}
.axis{stroke:#AAB6C2;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.grid{stroke:#AAB6C2;stroke-width:1;opacity:.14;fill:none}
.tick-text{fill:#AAB6C2;font-size:19px;text-anchor:middle;dominant-baseline:central}
.axis-letter{fill:#F3F5F7;font-size:29px;text-anchor:middle;dominant-baseline:central}
</style>
<title>三角形素材样式</title>
<path class="shape" d="M150 65 L420 260 L150 260 Z"/>
<path class="measure line-neutral" d="M150 239 H171 V260"/>
<path class="measure line-a" d="M150 279 V289 M150 284 H420 M420 279 V289"/>
<path class="measure line-b" d="M121 65 H131 M126 65 V260 M121 260 H131"/>
<text class="variable length-a" x="285" y="312">a</text><text class="variable length-b" x="98" y="162.5">b</text><text class="variable neutral" x="307" y="132">c</text>
<text class="vertex" x="142" y="39">A</text><text class="vertex" x="443" y="268">B</text><text class="vertex" x="123" y="280">C</text>
</svg>