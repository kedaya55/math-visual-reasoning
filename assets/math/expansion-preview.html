modules["diagram"]=(()=>{

modules["rational"]=(()=>{
// Exact school-level rational arithmetic. Public values remain JSON-serializable.
function gcd(a,b){a=a<0n?-a:a;while(b){[a,b]=[b,a%b]}return a;}
function reduced(n,d){if(d===0n)throw new RangeError('Zero denominator');if(d<0n){n=-n;d=-d}const g=gcd(n,d);n/=g;d/=g;const limit=BigInt(Number.MAX_SAFE_INTEGER);if(n>limit||n< -limit||d>limit)throw new RangeError('Rational exceeds safe integer range');return{n:Number(n),d:Number(d)};}
function rational(value=0){

 if(!value||!Number.isSafeInteger(value.n)||!Number.isSafeInteger(value.d))throw new RangeError('Safe integer numerator and denominator required');return reduced(BigInt(value.n),BigInt(value.d));
}
function rationalOp(a,op,b){a=rational(a);b=rational(b);const n=BigInt(a.n),d=BigInt(a.d),p=BigInt(b.n),q=BigInt(b.d);if(op==='+')return reduced(n*q+p*d,d*q);if(op==='-')return reduced(n*q-p*d,d*q);if(op==='*')return reduced(n*p,d*q);if(op==='/')return reduced(n*q,d*p);throw new RangeError('Unknown rational operation');}
function rationalText(a){a=rational(a);return a.d===1?String(a.n):`${a.n}/${a.d}`;}
function rationalNumber(a){a=rational(a);return a.n/a.d;}
function integerGcd(a,b){if(![a,b].every(Number.isSafeInteger)||a<0||b<0)throw new RangeError('Nonnegative safe integers required');return Number(gcd(BigInt(a),BigInt(b)));}
function integerLcm(a,b){if(a===0||b===0){integerGcd(a,b);return 0}const value=BigInt(a/integerGcd(a,b))*BigInt(b);if(value>BigInt(Number.MAX_SAFE_INTEGER))throw new RangeError('LCM exceeds safe range');return Number(value);}

return{rational,rationalOp,rationalText,rationalNumber,integerGcd,integerLcm};
})();
modules["place-value"]=(()=>{

const {createDiagram,diagramRect,diagramText}=modules["diagram"];
const {finite,positive,mathColors:C}=modules["svg-helpers"];
function placeValueModel({value='23.4',exchangePower=null,x=90,y=100,columnWidth=120,height=330}={}){
 if(typeof value!=='string'||!/^\d{1,6}(?:\.\d{1,4})?$/.test(value))throw new RangeError('Nonnegative decimal string, at most 6 integer and 4 decimal digits');finite([x,y]);positive([columnWidth,height]);const [whole,decimal='']=value.split('.'),digits=[...whole,...decimal].map(Number),powers=digits.map((_,i)=>whole.length-1-i),counts=new Map(powers.map((p,i)=>[p,digits[i]])),before=new Map(counts),transfers=[];

 sorted.forEach(([power,count],i)=>{const left=x+i*columnWidth,color=power>=0?C.green:C.purple,unit=power>=0?String(10**power):'0.'+'0'.repeat(-power-1)+'1';items.push(diagramRect(`col/${power}`,left,y,columnWidth-8,height,C.muted,{'fill-opacity':.03}));items.push(diagramText(`unit/${power}`,unit,left+(columnWidth-8)/2,y+30,color,22));items.push(diagramText(`count/${power}`,`${count} 个`,left+(columnWidth-8)/2,y+72,C.white,22));const tokens=Array.from({length:count},(_,j)=>{const old=before.get(power)??0,exchanged=power===exchangePower-1&&j>=old,id=exchanged?`p${power}/from${exchangePower}/${j-old}`:`p${power}/u${j}`;return{id,parentId:exchanged?transfers[0].parentId:null,value:rational(power>=0?10**power:{n:1,d:10**(-power)}),x:left+16+(j%3)*28,y:y+110+Math.floor(j/3)*28}});for(const t of tokens)items.push(diagramRect(t.id,t.x,t.y,19,19,color));columns.push({power,count,unit,tokens});});

modules["arithmetic-board"]=(()=>{
const {createDiagram,diagramText,diagramLine,diagramRect}=modules["diagram"];
const {integerGcd,integerLcm}=modules["rational"];
const {finite,mathColors:C}=modules["svg-helpers"];
function arithmeticModel({a=268,b=157,operation='+',step=0,x=360,y=100,cell=48}={}){
 if(![a,b].every(v=>Number.isSafeInteger(v)&&v>=0&&v<=999999)||!['+','-','*','/'].includes(operation))throw new RangeError('Nonnegative integers up to 999999 and + - * / required');if(operation==='-'&&b>a)throw new RangeError('This column subtraction model requires a ≥ b');if(operation==='/'&&b===0)throw new RangeError('Division by zero');finite([x,y,cell]);if(cell<20||cell>100)throw new RangeError('Cell 20–100 required');const steps=[],A=String(a).split('').reverse().map(Number),B=String(b).split('').reverse().map(Number);let result,remainder=0,partials=[];
 if(operation==='+'){let carry=0;for(let i=0;i<Math.max(A.length,B.length)||carry;i++){const incoming=carry,sum=(A[i]??0)+(B[i]??0)+incoming;carry=Math.floor(sum/10);steps.push({column:i,left:A[i]??0,right:B[i]??0,incoming,outgoing:carry,digit:sum%10,explanation:`${A[i]??0} + ${B[i]??0} + ${incoming} = ${sum}，本位写 ${sum%10}，进 ${carry}`})}result=a+b;}

 if(operation==='/'){items.push(diagramText('division',`${a} ÷ ${b}`,x,y,C.white,38));items.push(diagramText('quotient',`商 ${result}，余 ${remainder}`,x,y+80,C.green,30));}else{textRow('a',a,0);textRow('b',b,1);items.push(diagramText('operator',operation==='*'?'×':operation,x-Math.max(A.length,B.length)*cell,y+cell,C.muted,32));items.push(diagramLine('rule',[[x-(Math.max(A.length,B.length)+1)*cell,y+cell*1.6],[x+cell*.5,y+cell*1.6]],C.muted));if(operation==='*'){partials.forEach((p,i)=>textRow(`partial/${i}`,p.value,2+i,i===step?C.gold:C.muted));textRow('result',result,3+partials.length,C.green);}else{textRow('result',result,2.4,C.green);items.push(diagramRect('focus',x-current.column*cell-cell*.42,y-cell*.55,cell*.84,cell*3.35,C.gold,{'fill-opacity':.03}));if(current.outgoing)items.push(diagramText('carry',operation==='+'?'进1':'借1',x-(current.column+1)*cell,y-cell*.95,C.gold,18));}}

function factorsModel({a=18,b=24,x=130,y=120}={}){
 if(![a,b].every(n=>Number.isInteger(n)&&n>=1&&n<=10000))throw new RangeError('Integers 1–10000 required');finite([x,y]);const factor=n=>{const r=[];for(let p=2;p*p<=n;p++)while(n%p===0){r.push(p);n/=p}if(n>1)r.push(n);return r},fa=factor(a),fb=factor(b),items=[],used=new Set(),matches=fa.map((p,i)=>{const j=fb.findIndex((q,j)=>q===p&&!used.has(j));if(j>=0)used.add(j);return{aIndex:i,bIndex:j,value:p}});

const examples=modules['expansion-examples'].expansionExamples,ns='http://www.w3.org/2000/svg',canvas=document.querySelector('#canvas'),controls=document.querySelector('#controls'),title=document.querySelector('#title'),note=document.querySelector('#note'),summary=document.querySelector('#summary'),error=document.querySelector('#error'),categoryNav=document.querySelector('#categories'),exampleNav=document.querySelector('#examples'),gallery=document.querySelector('#gallery');
let selected,component,values={},category='数与运算',galleryMode=false;
const defaults=e=>Object.fromEntries(e.controls.map(c=>[c.key,c.value]));
function fit(svg){const b=svg.getBBox();if(![b.x,b.y,b.width,b.height].every(Number.isFinite))throw new Error('非有限图形边界');const w=Math.max(600,b.width+100),h=Math.max(360,b.height+100),ratio=5/3,fw=Math.max(w,h*ratio),fh=fw/ratio;svg.setAttribute('viewBox',`${b.x+b.width/2-fw/2} ${b.y+b.height/2-fh/2} ${fw} ${fh}`);}
function update(){try{const m=component.update(selected.options(values));fit(canvas);summary.textContent=selected.summary(m);error.textContent='';}catch(e){error.textContent=e.message;}}
function selectExample(id){selected=examples.find(e=>e.id===id);values=defaults(selected);canvas.replaceChildren();controls.replaceChildren();title.textContent=selected.title;note.textContent=selected.note;canvas.setAttribute('aria-label',selected.title+'预览');for(const c of selected.controls){const label=document.createElement('label'),span=document.createElement('span');span.textContent=c.label+' ';let input;if(c.options){input=document.createElement('select');for(const[value,text]of c.options){const option=document.createElement('option');option.value=value;option.textContent=text;input.append(option)}}else{input=document.createElement('input');input.type='range';input.min=c.min;input.max=c.max;input.step=c.step;const out=document.createElement('output');out.textContent=c.value;span.append(out)}input.value=c.value;input.name=c.key;input.addEventListener('input',()=>{values[c.key]=c.options?input.value:Number(input.value);const out=span.querySelector('output');if(out)out.textContent=input.value;update()});label.append(span,input);controls.append(label);}const reset=document.createElement('button');reset.textContent='恢复默认';reset.onclick=()=>selectExample(id);controls.append(reset);component=selected.create(canvas,selected.options(values));update();exampleNav.querySelectorAll('button').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.id===id)));}
function renderGallery(){gallery.replaceChildren();for(const e of examples.filter(e=>e.category===category)){const card=document.createElement('article'),h=document.createElement('h3'),svg=document.createElementNS(ns,'svg'),p=document.createElement('p');svg.setAttribute('viewBox','0 0 1000 600');svg.setAttribute('role','img');svg.setAttribute('aria-label',e.title+'总览');h.textContent=e.title;p.textContent=e.note;card.append(h,svg,p);gallery.append(card);e.create(svg,e.options(defaults(e)));fit(svg)}}
function selectCategory(c){category=c;categoryNav.querySelectorAll('button').forEach(b=>b.setAttribute('aria-selected',String(b.textContent===c)));exampleNav.replaceChildren();for(const e of examples.filter(e=>e.category===c)){const b=document.createElement('button');b.textContent=e.title;b.dataset.id=e.id;b.onclick=()=>{if(galleryMode)toggleGallery();selectExample(e.id)};exampleNav.append(b)}selectExample(examples.find(e=>e.category===c).id);if(galleryMode)renderGallery();}
for(const c of new Set(examples.map(e=>e.category))){const b=document.createElement('button');b.textContent=c;b.setAttribute('role','tab');b.onclick=()=>selectCategory(c);categoryNav.append(b)}
function toggleGallery(){galleryMode=!galleryMode;document.querySelector('#single').classList.toggle('hidden',galleryMode);gallery.classList.toggle('hidden',!galleryMode);document.querySelector('#gallery-toggle').textContent=galleryMode?'返回单个组件':'查看本领域总览';if(galleryMode)renderGallery();}
document.querySelector('#gallery-toggle').onclick=toggleGallery;
async function selfCheck(){const button=document.querySelector('#self-check'),output=document.querySelector('#check-output');button.disabled=true;let checked=0;const failures=[],reports=[],savedCategory=category,savedId=selected.id;if(galleryMode)toggleGallery();output.textContent='正在检查参数、节点身份、可重复更新与画面边界…';
 for(const e of examples){selectCategory(e.category);selectExample(e.id);const initial=defaults(e),root=component.group,serial=()=>root.outerHTML,baseline=serial();const variants=[initial];for(const c of e.controls){const values=c.options?c.options.map(o=>o[0]):[c.min,c.max,Math.round(((c.min+c.max)/2-c.min)/c.step)*c.step+c.min];for(const value of values)variants.push({...initial,[c.key]:value})}
  for(const v of variants){try{const nodes=new Map([...root.querySelectorAll('[data-part-id]')].map(n=>[n.dataset.partId,n]));const m=component.update(e.options(v));if(component.group!==root)throw new Error('根节点被替换');for(const n of root.querySelectorAll('[data-part-id]')){if(nodes.has(n.dataset.partId)&&nodes.get(n.dataset.partId)!==n)throw new Error('存续对象身份改变');for(const attr of n.attributes)if(/NaN|Infinity|undefined/.test(attr.value))throw new Error('非有限属性 '+attr.name)}fit(canvas);if(!m.items.length)throw new Error('空画面');const ids=m.items.map(i=>i.id);if(new Set(ids).size!==ids.length)throw new Error('重复 ID');const state=serial();component.update(e.options(v));if(serial()!==state)throw new Error('同一状态重复更新不一致');checked++;}catch(err){failures.push(e.title+'：'+err.message)}}
  component.update(e.options(initial));if(serial()!==baseline)failures.push(e.title+'：逆序恢复不一致');reports.push(e.title+'：'+variants.length+' 个状态');output.textContent=`已检查 ${checked} 个状态；发现 ${failures.length} 项问题。`;await new Promise(resolve=>requestAnimationFrame(resolve));
 }
 selectCategory(savedCategory);selectExample(savedId);output.textContent=`${failures.length?'检查未通过':'检查通过'}：${examples.length} 类示例，${checked} 个参数状态。\n${failures.length?failures.join('\n'):reports.join('\n')}\n这项检查不替代数学证明、正常速度播放或学生理解测试。`;button.disabled=false;}
document.querySelector('#self-check').onclick=selfCheck;selectCategory(category);
</script></body></html>
